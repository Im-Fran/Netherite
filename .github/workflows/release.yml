name: Release

# Every tag is archived with the App Store distribution signature for iOS/iPadOS
# and macOS, and uploaded to TestFlight. Never a direct App Store submission:
# the build sits there until someone promotes it, so shipping stays manual.
#
# The same tag also builds the Developer ID macOS app (notarized, with
# OpenUpdater) and publishes it as the GitHub release v<version>:
# Netherite.dmg for manual installs, Netherite.zip + .zip.sig for OpenUpdater.
# Notes come from CHANGELOG.md.
# The release drops the +build suffix: OpenUpdater compares it to
# CFBundleShortVersionString. Versions with a "-" (1.4.0-beta.1) are pre-releases.
#
# Tag format: <version>[+<build>], with an optional leading "v".
#   1.4.0+7  → version 1.4.0, build 7
#   1.4.0    → version 1.4.0, build = latest on TestFlight + 1
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. 1.0.0+1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    # Waiting for TestFlight processing (to attach the notes) and notarization.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: TestFlight iOS, platform: ios, lane: beta }
          - { name: TestFlight macOS, platform: mac, lane: beta }
          - { name: Developer ID macOS, platform: mac, lane: direct }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_REPOSITORY_URL: ${{ secrets.MATCH_REPOSITORY_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      - uses: actions/checkout@v7

      # The tag reaches the shell through the environment, never interpolated
      # into the script: a ref name is attacker-shaped input.
      - name: Read version from the tag
        id: version
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *[!A-Za-z0-9.+_-]*)
              echo "Refusing tag with unexpected characters: $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          BUILD=""
          case "$VERSION" in
            *+*)
              BUILD="${VERSION##*+}"
              VERSION="${VERSION%%+*}"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (${BUILD:-auto}) from $TAG"

      # Ruby 4: Gemfile.lock is in bundler 4's format, which bundler 2.x cannot read.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      # beta uploads to TestFlight (no workflow artifact: the App Store-signed
      # .ipa/.pkg can't be installed outside the store); direct builds the
      # notarized Developer ID .dmg/.zip.
      - name: Build (${{ matrix.lane }})
        env:
          PLATFORM: ${{ matrix.platform }}
          LANE: ${{ matrix.lane }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          OPENUPDATER_PRIVATE_KEY: ${{ matrix.lane == 'direct' && secrets.OPENUPDATER_PRIVATE_KEY || '' }}
        run: bundle exec fastlane "$PLATFORM" "$LANE" version:"$VERSION" ${BUILD:+build_number:"$BUILD"}

      - name: Publish the GitHub release
        if: matrix.lane == 'direct'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          NOTES="--generate-notes"
          [ -s build/release-notes.md ] && NOTES="--notes-file=build/release-notes.md"
          gh release create "v$VERSION" build/Netherite.dmg build/Netherite.zip build/Netherite.zip.sig \
            --target "$GITHUB_SHA" --title "Netherite $VERSION" "$NOTES" $PRERELEASE
