name: Netherite
options:
  bundleIdPrefix: cl.franciscosolis
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  NetheriteCore:
    path: Packages/NetheriteCore
targets:
  Netherite:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - Netherite
    dependencies:
      - package: NetheriteCore
        product: NetheriteCore
    entitlements:
      path: Netherite/Netherite.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.cl.franciscosolis.netherite]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.cl.franciscosolis.netherite]
        com.apple.security.application-groups: [group.cl.franciscosolis.netherite]
    info:
      path: Netherite/Info.plist
      properties:
        CFBundleDisplayName: Netherite
        LSApplicationCategoryType: public.app-category.productivity
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSMicrophoneUsageDescription: Netherite records audio notes that are saved into your vault.
        NSUbiquitousContainers:
          iCloud.cl.franciscosolis.netherite:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Netherite
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleURLTypes:
          - CFBundleURLName: cl.franciscosolis.netherite
            CFBundleURLSchemes: [netherite]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.netherite
        PRODUCT_NAME: Netherite
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  Netherite:
    build:
      targets:
        Netherite: all
